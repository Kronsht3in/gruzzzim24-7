<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Грузчик Игра</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #008CBA;
            color: white;
        }
        button:hover {
            background-color: #005f73;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-bar-fill {
            height: 100%;
            background-color: #4caf50;
            width: 0%;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        .tasks {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .task-button {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Главный экран -->
        <div id="main-screen" style="display: block;">
            <h1 id="player-name">Грузчик</h1>
            <p>Уровень: <span id="level">1</span></p>
            <p>XP: <span id="currentXp">0</span> / <span id="nextLevelXp">10</span></p>
            <div class="progress-bar">
                <div id="progressBarFill" class="progress-bar-fill"></div>
            </div>
            <img src="https://i.imgur.com/your-loader-imahttps://avatars.mds.yandex.net/i?id=867b6b41773201737f49cece1d657216_l-4011168-images-thumbs&n=13ge.png" alt="Грузчик" id="loader-image">
            <button onclick="renameCharacter()">Изменить имя</button>
            <div style="margin-top: 20px;">
                <button onclick="showUnloadingScreen()">Разгрузка машины</button>
                <button onclick="showTasksScreen()">Задания</button>
            </div>
        </div>

        <!-- Экран разгрузки машины -->
        <div id="unloading-screen" style="display: none;">
            <h2>Разгрузка машины...</h2>
            <p id="unload-timer">Осталось: 10 секунд</p>
            <button onclick="completeUnloading()" id="unload-button" disabled>Завершить</button>
            <button onclick="backToMain('unloading')">Назад</button>
        </div>

        <!-- Экран заданий -->
        <div id="tasks-screen" style="display: none;">
            <h2>Задания</h2>
            <div class="tasks">
                <button class="task-button" onclick="openReferralLink()">Пригласить друга</button>
                <button class="task-button" onclick="checkSubscription()">Подписаться на канал</button>
                <button class="task-button" onclick="shareInStatus()">Добавить в статус</button>
            </div>
            <button onclick="backToMain('tasks')">Назад</button>
        </div>
    </div>

    <script>
        // Состояние игрока
        let player = {
            name: "Грузчик",
            level: 1,
            xp: 0,
            nextLevelXp: 10
        };

        // Обновление интерфейса
        function updateUI() {
            document.getElementById('player-name').textContent = player.name;
            document.getElementById('level').textContent = player.level;
            document.getElementById('currentXp').textContent = player.xp;
            document.getElementById('nextLevelXp').textContent = player.nextLevelXp;

            const progress = (player.xp / player.nextLevelXp) * 100;
            document.getElementById('progressBarFill').style.width = `${progress}%`;
        }

        // Получение опыта
        function gainXp(amount) {
            player.xp += amount;
            if (player.xp >= player.nextLevelXp) {
                player.level++;
                player.xp -= player.nextLevelXp;
                player.nextLevelXp = Math.ceil(player.nextLevelXp * 1.5); // Увеличение XP для следующего уровня
            }
            updateUI();
        }

        // Переименование персонажа
        function renameCharacter() {
            const newName = prompt("Введите новое имя для вашего персонажа:");
            if (newName && newName.trim() !== "") {
                player.name = newName.trim();
                updateUI();
            }
        }

        // Разгрузка машины
        let unloadTimer;
        function showUnloadingScreen() {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('unloading-screen').style.display = 'block';

            let timeLeft = 10;
            document.getElementById('unload-timer').textContent = `Осталось: ${timeLeft} секунд`;
            document.getElementById('unload-button').disabled = true;

            unloadTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('unload-timer').textContent = `Осталось: ${timeLeft} секунд`;
                if (timeLeft <= 0) {
                    clearInterval(unloadTimer);
                    document.getElementById('unload-button').disabled = false;
                }
            }, 1000);
        }

        function completeUnloading() {
            clearInterval(unloadTimer);
            const xpGained = Math.floor(Math.random() * 10) + 5; // Случайное количество XP (от 5 до 15)
            gainXp(xpGained);
            alert(`Вы разгрузили машину и получили ${xpGained} XP!`);
            backToMain('unloading');
        }

        // Задания
        function openReferralLink() {
            const referralLink = "https://t.me/your_bot?start=ref_12345"; // Замените на реальную ссылку
            window.open(referralLink, "_blank");
        }

        function checkSubscription() {
            alert("Функция проверки подписки не реализована в этом примере.");
            // Здесь можно добавить логику проверки подписки через API Telegram
        }

        function shareInStatus() {
            if (navigator.share) {
                navigator.share({
                    title: "Грузчик Игра",
                    text: "Присоединяйтесь ко мне в игре Грузчик!",
                    url: "https://kronsht3in.github.io/gruzim-24-7/"
                }).then(() => {
                    gainXp(10);
                    alert("Вы добавили игру в статус и получили 10 XP!");
                }).catch((error) => {
                    console.error("Ошибка при делении:", error);
                });
            } else {
                alert("Ваш браузер не поддерживает функцию деления.");
            }
        }

        // Возврат к главному экрану
        function backToMain(from) {
            document.getElementById('main-screen').style.display = 'block';
            document.getElementById('unloading-screen').style.display = 'none';
            document.getElementById('tasks-screen').style.display = 'none';
        }

        // Показать экран заданий
        function showTasksScreen() {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('tasks-screen').style.display = 'block';
        }

        // Инициализация игры
        updateUI();
    </script>
</body>
</html>
