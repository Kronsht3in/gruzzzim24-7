<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Грузчик Игра</title>
    <style>
        /* Общие стили */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: url('background-truck.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
        }

        /* Главный контейнер */
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Информация о игроке */
        .player-info {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Прогресс-бар */
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-bar-fill {
            height: 100%;
            background-color: #4caf50;
            width: 0%;
            transition: width 0.5s ease-in-out;
        }

        /* Контейнер для 3D-модели */
        #model-container {
            width: 100%;
            height: 200px;
            position: relative;
            margin-top: 20px;
        }

        /* Экран разгрузки */
        #unloading-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Анимация разгрузки */
        .truck-animation {
            position: relative;
            width: 100%;
            height: 150px;
        }
        .truck {
            width: 100px;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            animation: move-truck 2s infinite;
        }
        .loader {
            width: 50px;
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            animation: unload 2s infinite;
        }

        @keyframes move-truck {
            0% { transform: translateY(0) translateX(-50%); }
            50% { transform: translateY(-10px) translateX(-50%); }
            100% { transform: translateY(0) translateX(-50%); }
        }
        @keyframes unload {
            0% { transform: rotate(0deg) translateX(-50%); }
            50% { transform: rotate(30deg) translateX(-50%); }
            100% { transform: rotate(0deg) translateX(-50%); }
        }

        /* Нижние кнопки */
        .bottom-buttons {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            background: #fff;
            padding: 10px 0;
            border-top: 1px solid #ddd;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        }
        .bottom-button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 25px;
            background-color: #007BFF;
            color: white;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .bottom-button:hover {
            background-color: #0056b3;
            transform: scale(1.1);
        }

        /* Задания */
        .tasks {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .task-button {
            margin: 10px 0;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #008CBA;
            color: white;
            transition: background-color 0.3s;
        }
        .task-button:hover {
            background-color: #005f73;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Главный экран (Профиль) -->
        <div id="main-screen" style="display: block;">
            <div class="player-info">
                <h1 id="player-name">Грузчик</h1>
                <p>Уровень: <span id="level">1</span></p>
                <p>XP: <span id="currentXp">0</span> / <span id="nextLevelXp">10</span></p>
                <div class="progress-bar">
                    <div id="progressBarFill" class="progress-bar-fill"></div>
                </div>
                <button onclick="renameCharacter()">Изменить имя</button>
            </div>
            <div id="model-container"></div>
        </div>

        <!-- Экран разгрузки машины -->
        <div id="unloading-screen" style="display: none;">
            <h2>Разгрузка машины</h2>
            <button onclick="startUnloading()" id="unload-start-button">Разгрузить машину</button>
            <div class="truck-animation">
                <img src="truck.png" alt="Грузовик" class="truck">
                <img src="loader.png" alt="Грузчик" class="loader">
            </div>
            <div class="progress-bar">
                <div id="unloadProgressBarFill" class="progress-bar-fill"></div>
            </div>
            <p id="unload-timer">Осталось: 10 секунд</p>
            <button onclick="completeUnloading()" id="unload-button" disabled>Завершить</button>
        </div>

        <!-- Экран заданий -->
        <div id="tasks-screen" style="display: none;">
            <h2>Задания</h2>
            <div class="tasks">
                <button class="task-button" onclick="showReferralTask()">Пригласить друга</button>
                <button class="task-button" onclick="showSubscribeTask()">Подписаться на канал</button>
                <button class="task-button" onclick="showStatusTask()">Добавить в статус</button>
            </div>
        </div>
    </div>

    <!-- Нижние кнопки -->
    <div class="bottom-buttons">
        <button class="bottom-button" onclick="showUnloadingScreen()">
            <img src="unload-icon.png" alt="Разгрузка" width="24" height="24"> Разгрузка машины
        </button>
        <button class="bottom-button" onclick="showProfileScreen()">
            <img src="profile-icon.png" alt="Профиль" width="24" height="24"> Профиль
        </button>
        <button class="bottom-button" onclick="showTasksScreen()">
            <img src="tasks-icon.png" alt="Задания" width="24" height="24"> Задания
        </button>
    </div>

    <!-- Подключение Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Состояние игрока
        let player = {
            name: "Грузчик",
            level: 1,
            xp: 0,
            nextLevelXp: 10
        };

        // Обновление интерфейса
        function updateUI() {
            document.getElementById('player-name').textContent = player.name;
            document.getElementById('level').textContent = player.level;
            document.getElementById('currentXp').textContent = player.xp;
            document.getElementById('nextLevelXp').textContent = player.nextLevelXp;
            const progress = (player.xp / player.nextLevelXp) * 100;
            document.getElementById('progressBarFill').style.width = `${progress}%`;
        }

        // Получение опыта
        function gainXp(amount) {
            player.xp += amount;
            if (player.xp >= player.nextLevelXp) {
                player.level++;
                player.xp -= player.nextLevelXp;
                player.nextLevelXp = Math.ceil(player.nextLevelXp * 1.5);
            }
            updateUI();
        }

        // Разгрузка машины
        let unloadTimer;
        function startUnloading() {
            document.getElementById('unload-start-button').style.display = 'none';
            let timeLeft = 10;
            const progressBar = document.getElementById('unloadProgressBarFill');
            const timerElement = document.getElementById('unload-timer');

            unloadTimer = setInterval(() => {
                timeLeft--;
                timerElement.textContent = `Осталось: ${timeLeft} секунд`;
                progressBar.style.width = `${(10 - timeLeft) * 10}%`;

                if (timeLeft <= 0) {
                    clearInterval(unloadTimer);
                    document.getElementById('unload-button').disabled = false;
                }
            }, 1000);
        }

        function completeUnloading() {
            clearInterval(unloadTimer);
            const xpGained = Math.floor(Math.random() * 10) + 5;
            gainXp(xpGained);
            alert(`Вы разгрузили машину и получили ${xpGained} XP!`);
            backToMain('unloading');
        }

        // Показать профиль
        function showProfileScreen() {
            document.getElementById('main-screen').style.display = 'block';
            document.getElementById('unloading-screen').style.display = 'none';
            document.getElementById('tasks-screen').style.display = 'none';
            init3DModel();
        }

        // Показать разгрузку машины
        function showUnloadingScreen() {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('unloading-screen').style.display = 'flex';
            document.getElementById('tasks-screen').style.display = 'none';
            document.getElementById('unload-start-button').style.display = 'block';
            document.getElementById('unloadProgressBarFill').style.width = '0%';
            document.getElementById('unload-timer').textContent = 'Осталось: 10 секунд';
        }

        // Показать задания
        function showTasksScreen() {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('unloading-screen').style.display = 'none';
            document.getElementById('tasks-screen').style.display = 'block';
        }

        // Возврат к главному экрану
        function backToMain(from) {
            document.getElementById('main-screen').style.display = 'block';
            document.getElementById('unloading-screen').style.display = 'none';
            document.getElementById('tasks-screen').style.display = 'none';
        }

        // 3D-модель грузчика
        function init3DModel() {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth * 0.8, 200);
            document.getElementById('model-container').appendChild(renderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(10, 10, 10).normalize();
            scene.add(light);

            const loader = new THREE.GLTFLoader();
            loader.load('loader.glb', function(gltf) {
                const model = gltf.scene;
                model.scale.set(0.5, 0.5, 0.5);
                model.position.y = -1;
                scene.add(model);

                function animate() {
                    requestAnimationFrame(animate);
                    model.rotation.y += 0.01;
                    renderer.render(scene, camera);
                }
                animate();
            });
        }

        // Изменение имени персонажа
        function renameCharacter() {
            const newName = prompt("Введите новое имя для вашего персонажа:");
            if (newName && newName.trim() !== "") {
                player.name = newName.trim();
                updateUI();
            }
        }

        // Реферальная система
        function showReferralTask() {
            alert(`Ваша реферальная ссылка:\nhttps://t.me/your_bot?start=ref_${player.chat_id}\nКаждый приглашенный друг дает +20 XP.`);
        }

        // Подписка на канал
        function showSubscribeTask() {
            alert("Подпишитесь на канал, чтобы получить +15 XP.");
        }

        // Добавление в статус
        function showStatusTask() {
            alert("Добавьте игру в свой статус Telegram, чтобы получить +10 XP.");
        }

        // Инициализация игры
        updateUI();
        showProfileScreen(); // По умолчанию показываем профиль
    </script>
</body>
</html>
