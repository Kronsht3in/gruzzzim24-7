<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Грузчик Игра</title>
    <style>
        /* Общие стили */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: url('https://static.vecteezy.com/system/resources/previews/000/154/316/original/vector-movers-man-carrying-cardboard-boxes.jpg') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden; /* Убираем скролл */
        }

        /* Главный контейнер */
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Информация о игроке */
        .player-info {
            text-align: center;
            margin-bottom: 30px;
        }
        #profile-player-name {
            font-size: 24px;
        }
        .player-stats {
            font-size: 18px;
            margin-bottom: 10px;
        }
        
         /* Прогресс-бар для XP на главном экране */
         .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-bar-fill {
            height: 100%;
            background-color: #4caf50;
            width: 0%;
            transition: width 0.5s ease-in-out;
        }

        /* Моделька игрока */
        img.player-model {
            width: 200px;
            animation: player-spin 5s infinite;
            margin: 0 auto;
            display: block;
        }
        @keyframes player-spin {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        /* Экран разгрузки машины */
        #unloading-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8); /* Темный фон для экрана разгрузки */
        }

        /* Заголовок "Разгрузка машины" */
        #unloading-screen h2 {
            font-size: 28px;
            color: #FFC107;
            margin-bottom: 20px;
        }

        /* Кнопка "Разгрузить машину" */
        #unload-start-button {
            padding: 15px 30px; /* Горизонтально прямоугольная кнопка */
            font-size: 20px;
            cursor: pointer;
            border: none;
            border-radius: 15px;
            background-color: #ffdd00;
            color: white;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        #unload-start-button:hover {
            background-color: #0056b3;
            transform: scale(1.1);
        }

        /* Ползунок разгрузки машины */
        #unload-progress-container {
            width: 100%;
            margin-bottom: 20px;
        }

        /* Анимация разгрузки */
        .truck-animation {
            position: relative;
            width: 100%;
            height: 200px; /* Вертикальная высота */
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        /* Грузовик */
        .truck {
    width: 300px; /* Увеличен размер */
    transform: rotateY(180deg);
    animation: move-truck 2s infinite;
    opacity: 0; /* Скрыто по умолчанию */
    float: left; /* Позиционируем грузовик слева */
        }

        /* Грузчик */
         .loader {
    width: 150px; /* Увеличен размер */
    margin-right: 35px; /* Предыдущий отступ */
    animation: unload 2s infinite;
    opacity: 0; /* Скрыто по умолчанию */
    float: right; /* Позиционируем грузчика справа */
        }

         /* Изначально элементы скрыты */
        .truck, .loader {
    opacity: 0;
    transition: opacity 0.5s; /* Плавный переход при появлении */
         }

        /* Показываем анимацию только при активации */
        .truck.active, .loader.active {
    opacity: 1; /* Появление элемента */
    animation: move-truck 2s infinite; /* Запускаем анимацию грузовика */
         }

         .loader.active {
    animation: unload 2s infinite; /* Запускаем анимацию грузчика */
          }

        /* Анимация грузовика */
         @keyframes move-truck {
    0% { transform: translateY(0) rotateY(180deg); }
    50% { transform: translateY(-20px) rotateY(180deg); }
    100% { transform: translateY(0) rotateY(180deg); }
         }

/* Анимация грузчика */
        @keyframes unload {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(45deg); }
    100% { transform: rotate(0deg); }
         }

        /* Кнопка "Изменить имя" */
        #rename-button {
            padding: 15px 30px; /* Аналогично кнопке "Разгрузить машину" */
            font-size: 20px;
            cursor: pointer;
            border: none;
            border-radius: 15px;
            background-color: #FF9800; /* Оранжевый цвет */
            color: white;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
        }
        #rename-button:hover {
            background-color: #E65100;
            transform: scale(1.1);
        }

        /* Кнопки заданий */
        .task {
            margin: 15px 0;
            padding: 20px 30px; /* Более крупные кнопки */
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background-color: #008CBA;
            color: white;
            transition: background-color 0.3s;
            width: 80%; /* Ограничение ширины */
            max-width: 300px;
        }
        .task:hover {
            background-color: #005f73;
        }

        /* Нижние кнопки */
        .bottom-buttons {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            background: #bdbf3e;
            padding: 10px 30px;
            border-radius: 30px;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            box-sizing: border-box;
        }
        .bottom-button {
            padding: 12px;
            border: none;
            border-radius: 40%; /* Круглые кнопки */
            background-color: #ffffff;
            color: #4CAF50;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .bottom-button:hover {
            background-color: #e0f7ea;
            transform: scale(1.1);
        }

        /* Подвинуть иконки левее */
        .bottom-button img {
            width: 48px; /* Увеличенные иконки */
            height: 48px;
            margin-right: 5px; /* Отступ от края */
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Профиль -->
        <div id="main-screen" style="display: block;">
            <div class="player-info">
                <h1 id="profile-player-name">Профиль: Грузчик</h1>
                <p class="player-stats">Уровень: <span id="profile-level">1</span></p>
                <p class="player-stats">XP: <span id="profile-currentXp">0</span> / <span id="profile-nextLevelXp">10</span></p>
                <div class="progress-bar">
                    <div id="profile-progressBarFill" class="progress-bar-fill"></div>
                </div>
                <button id="rename-button" onclick="startRename()">Изменить имя</button>
            </div>
            <img src="loaders.png" alt="Моделька игрока" class="player-model">
        </div>

        <!-- Разгрузка машины -->
        <div id="unloading-screen" style="display: none;">
            <h2>Разгрузка машины</h2>
            <button onclick="startUnloading()" id="unload-start-button">Разгрузить машину</button>
            <div class="truck-animation">
                <img src="truck.png" alt="Грузовик" class="truck">
                <img src="loader.png" alt="Грузчик" class="loader">
            </div>
            <div class="progress-bar">
                <div id="unloadProgressBarFill" class="progress-bar-fill"></div>
            </div>
            <p id="unload-timer">Осталось: 10 секунд</p>
        </div>

        <!-- Задания -->
        <div id="tasks-screen" style="display: none;">
            <h2>Задания</h2>
            <button class="task" onclick="showReferralTask()">Пригласить друга</button>
            <button class="task" onclick="showSubscribeTask()">Подписаться на канал</button>
            <button class="task" onclick="showStatusTask()">Добавить в статус</button>
        </div>
    </div>

      <!-- Нижние кнопки -->
      <div class="bottom-buttons">
        <button class="bottom-button" onclick="showUnloadingScreen()" style="margin-right: 40px;"> <!-- Сдвинутая левее -->
            <img src="unload-icon.png" alt="Разгрузка">
        </button>
        <button class="bottom-button" onclick="showProfileScreen()" style="margin-right: 40px;"> <!-- Сдвинутая левее -->
            <img src="profile-icon.png" alt="Профиль">
        </button>
        <button class="bottom-button" onclick="showTasksScreen()" style="margin-right: 45px;"> <!-- Сдвинутая левее -->
            <img src="tasks-icon.png" alt="Задания">
        </button>
    </div>

    <script>
        // Состояние игрока
        let player = {
            name: "Грузчик",
            level: 1,
            xp: 0,
            nextLevelXp: 10,
        };

        // Обновление интерфейса
        function updateUI() {
            document.getElementById('profile-player-name').textContent = `Профиль: ${player.name}`;
            document.getElementById('profile-level').textContent = player.level;
            document.getElementById('profile-currentXp').textContent = player.xp;
            document.getElementById('profile-nextLevelXp').textContent = player.nextLevelXp;

            const progress = (player.xp / player.nextLevelXp) * 100;
            document.getElementById('profile-progressBarFill').style.width = `${progress}%`;
        }

        // Получение опыта
        function gainXp(amount) {
            player.xp += amount;
            if (player.xp >= player.nextLevelXp) {
                player.level++;
                player.xp -= player.nextLevelXp;
                player.nextLevelXp = Math.ceil(player.nextLevelXp * 1.5);
            }
            updateUI();
        }

        // Функции для показа экранов
        function showProfileScreen() {
            document.getElementById('main-screen').style.display = 'block';
            document.getElementById('unloading-screen').style.display = 'none';
            document.getElementById('tasks-screen').style.display = 'none';
        }

        function showUnloadingScreen() {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('unloading-screen').style.display = 'flex';
            document.getElementById('tasks-screen').style.display = 'none';

            const truck = document.querySelector('.truck');
            const loader = document.querySelector('.loader');
            const unloadButton = document.querySelector('.unload-button');

            // Добавляем обработчик события на кнопку
         unloadButton.addEventListener('click', () => {
            // Проверяем, активны ли элементы, и переключаем классы
         truck.classList.toggle('active');
         loader.classList.toggle('active');
         });
            // Возвращаем кнопку "Разгрузить машину"
            document.getElementById('unload-start-button').style.display = 'block';
            document.getElementById('unload-button').style.display = 'none';
            document.getElementById('unloadProgressBarFill').style.width = '0%';
            document.getElementById('unload-timer').textContent = 'Осталось: 10 секунд';
        }

        function showTasksScreen() {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('unloading-screen').style.display = 'none';
            document.getElementById('tasks-screen').style.display = 'block';
        }

        // Начало разгрузки машины
        let unloadTimer;
        function startUnloading() {
            const truck = document.querySelector('.truck');
            const loader = document.querySelector('.loader');

            // Показываем анимацию
            truck.classList.add('active');
            loader.classList.add('active');

            // Скрываем кнопку "Разгрузить машину" на время разгрузки
            document.getElementById('unload-start-button').style.display = 'none';

            let timeLeft = 10;
            const progressBar = document.getElementById('unloadProgressBarFill');
            const timerElement = document.getElementById('unload-timer');

            unloadTimer = setInterval(() => {
                timeLeft--;
                timerElement.textContent = `Осталось: ${timeLeft} секунд`;
                progressBar.style.width = `${(10 - timeLeft) * 10}%`;

                if (timeLeft <= 0) {
                    clearInterval(unloadTimer);
                    completeUnloading();
                }
            }, 1000);
        }

        // Завершение разгрузки машины
        function completeUnloading() {
            clearInterval(unloadTimer);

            // Грузовик уезжает
            const truck = document.querySelector('.truck');
            truck.classList.remove('active'); // Останавливаем анимацию грузовика
        
            // Грузчик остается на месте
            const loader = document.querySelector('.loader');
            loader.classList.remove('active'); // Останавливаем анимацию грузчика

            // Возвращаем кнопку "Разгрузить машину"
            document.getElementById('unload-start-button').style.display = 'block';

            const xpGained = Math.floor(Math.random() * 10) + 5;
            gainXp(xpGained);

            alert(`Вы разгрузили машину и получили ${xpGained} XP!`);

        }

        // Изменение имени персонажа
        function startRename() {
            const newName = prompt("Введите новое имя для вашего персонажа:");
            if (newName && newName.trim() !== "") {
                player.name = newName.trim();
                gainXp(5); // +5 XP за изменение имени
                updateUI();
            } else {
                alert("Имя не может быть пустым.");
            }
        }

        // Реферальная система
        function showReferralTask() {
            alert(`Ваша реферальная ссылка:\nhttps://t.me/your_bot?start=ref_${player.chat_id}\nКаждый приглашенный друг дает +20 XP.`);
        }

        // Подписка на канал
        function showSubscribeTask() {
            alert("Подпишитесь на канал, чтобы получить +15 XP.");
        }

        // Добавление в статус
        function showStatusTask() {
            alert("Добавьте игру в свой статус Telegram, чтобы получить +10 XP.");
        }
        
        // Сохранение данных в бот после завершения действия
     function saveProgressToBot() {
            const data = {
                chatId: player.chat_id,
                name: player.name,
                xp: player.xp,
                level: player.level,
                nextLevelXp: player.next_level_xp,
            };

            fetch('/save_progress', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            })
            .then(response => response.json())
            .then(result => {
                console.log('Данные успешно сохранены:', result);
            })
            .catch(error => {
                console.error('Ошибка при сохранении данных:', error);
            });
        }

        // Автоматическое сохранение данных перед закрытием страницы
        window.addEventListener('beforeunload', function () {
            saveProgressToBot(); // Сохраняем прогресс перед закрытием
        });
         // Инициализация
         getUrlParams();
        updateUI();
    </script>
</body>
</html>
