<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Грузчик Игра</title>
    <style>
        /* Общие стили */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: url('background-truck.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
        }

        /* Главный контейнер */
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Информация о игроке (Профиль) */
        .player-info {
            text-align: center;
            margin-bottom: 30px;
        }
        #profile-player-name {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .player-stats {
            font-size: 18px;
            margin-bottom: 20px;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-bar-fill {
            height: 100%;
            background-color: #4caf50;
            width: 0%;
            transition: width 0.5s ease-in-out;
        }

        /* Моделька игрока на экране профиля */
        img.player-model {
            width: 150px; /* Увеличена моделька */
            height: auto;
            margin: 20px auto;
            display: block;
            animation: player-spin 5s infinite;
        }

        @keyframes player-spin {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        /* Экран разгрузки машины */
        #unloading-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Заголовок "Разгрузка машины" */
        #unloading-screen h2 {
            font-size: 28px; /* Увеличен размер текста */
            color: #FFC107; /* Яркий цвет заголовка */
            margin-bottom: 20px;
        }

        /* Кнопка "Разгрузить машину" */
        #unload-start-button {
            padding: 20px 40px;
            font-size: 20px;
            cursor: pointer;
            border: none;
            border-radius: 15px;
            background-color: #007BFF;
            color: white;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        #unload-start-button:hover {
            background-color: #0056b3;
            transform: scale(1.1);
        }

        /* Анимация разгрузки */
        .truck-animation {
            position: relative;
            width: 100%;
            height: 250px; /* Увеличен размер анимации */
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .truck {
            width: 200px; /* Увеличен грузовик */
            transform: rotateY(180deg);
            animation: move-truck 2s infinite;
            opacity: 0; /* Скрыть по умолчанию */
        }

        .loader {
            width: 100px; /* Увеличен грузчик */
            margin-left: 20px;
            animation: unload 2s infinite;
            opacity: 0; /* Скрыть по умолчанию */
        }

        /* Показать анимацию после нажатия */
        .truck.active, .loader.active {
            opacity: 1;
        }

        @keyframes move-truck {
            0% { transform: translateY(0) rotateY(180deg); }
            50% { transform: translateY(-20px) rotateY(180deg); }
            100% { transform: translateY(0) rotateY(180deg); }
        }

        @keyframes unload {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(45deg); }
            100% { transform: rotate(0deg); }
        }

        /* Нижние кнопки с иконками */
        .bottom-buttons {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            background: #4CAF50;
            padding: 10px 20px;
            border-top: 1px solid #3E8E41;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        }
        .bottom-button {
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 50%; /* Круглые кнопки */
            background-color: #ffffff;
            color: #4CAF50;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .bottom-button:hover {
            background-color: #e0f7ea;
            transform: scale(1.1);
        }

        /* Иконки для кнопок */
        .bottom-button img {
            width: 24px;
            height: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Главный экран (Профиль) -->
        <div id="main-screen" style="display: block;">
            <div class="player-info">
                <h1 id="profile-player-name">Профиль: Грузчик</h1>
                <p class="player-stats">Уровень: <span id="profile-level">1</span></p>
                <p class="player-stats">XP: <span id="profile-currentXp">0</span> / <span id="profile-nextLevelXp">10</span></p>
                <div class="progress-bar">
                    <div id="profile-progressBarFill" class="progress-bar-fill"></div>
                </div>
                <!-- Кнопка "Изменить имя" -->
                <button id="rename-button" onclick="startRename()">Изменить имя</button>
            </div>
            <!-- Моделька игрока -->
            <img src="images/loader.png" alt="Моделька игрока" class="player-model">
        </div>

        <!-- Экран разгрузки машины -->
        <div id="unloading-screen" style="display: none;">
            <h2>Разгрузка машины</h2>
            <button onclick="startUnloading()" id="unload-start-button">Разгрузить машину</button>
            
            <!-- Анимация разгрузки -->
            <div class="truck-animation">
                <img src="images/truck.png" alt="Грузовик" class="truck">
                <img src="images/loader.png" alt="Грузчик" class="loader">
            </div>
            
            <div class="progress-bar">
                <div id="unloadProgressBarFill" class="progress-bar-fill"></div>
            </div>
            <p id="unload-timer">Осталось: 10 секунд</p>
            <button onclick="completeUnloading()" id="unload-button" disabled>Завершить</button>
        </div>

        <!-- Экран заданий -->
        <div id="tasks-screen" style="display: none;">
            <h2>Задания</h2>
            <button class="task" onclick="showReferralTask()">Пригласить друга</button>
            <button class="task" onclick="showSubscribeTask()">Подписаться на канал</button>
            <button class="task" onclick="showStatusTask()">Добавить в статус</button>
        </div>
    </div>

    <!-- Нижние кнопки с иконками -->
    <div class="bottom-buttons">
        <button class="bottom-button" onclick="showUnloadingScreen()">
            <img src="unload-icon.png" alt="Разгрузка">
        </button>
        <button class="bottom-button" onclick="showProfileScreen()">
            <img src="profile-icon.png" alt="Профиль">
        </button>
        <button class="bottom-button" onclick="showTasksScreen()">
            <img src="tasks-icon.png" alt="Задания">
        </button>
    </div>

    <script>
        // Состояние игрока
        let player = {
            name: "Грузчик",
            level: 1,
            xp: 0,
            nextLevelXp: 10
        };

        // Обновление интерфейса
        function updateUI() {
            document.getElementById('profile-player-name').textContent = `Профиль: ${player.name}`;
            document.getElementById('profile-level').textContent = player.level;
            document.getElementById('profile-currentXp').textContent = player.xp;
            document.getElementById('profile-nextLevelXp').textContent = player.nextLevelXp;
            const progress = (player.xp / player.nextLevelXp) * 100;
            document.getElementById('profile-progressBarFill').style.width = `${progress}%`;
        }

        // Получение опыта
        function gainXp(amount) {
            player.xp += amount;
            if (player.xp >= player.nextLevelXp) {
                player.level++;
                player.xp -= player.nextLevelXp;
                player.nextLevelXp = Math.ceil(player.nextLevelXp * 1.5);
            }
            updateUI();
        }

        // Разгрузка машины
        let unloadTimer;
        function startUnloading() {
            document.getElementById('unload-start-button').style.display = 'none';
            const truck = document.querySelector('.truck');
            const loader = document.querySelector('.loader');

            // Показываем анимацию
            truck.classList.add('active');
            loader.classList.add('active');

            let timeLeft = 10;
            const progressBar = document.getElementById('unloadProgressBarFill');
            const timerElement = document.getElementById('unload-timer');

            unloadTimer = setInterval(() => {
                timeLeft--;
                timerElement.textContent = `Осталось: ${timeLeft} секунд`;
                progressBar.style.width = `${(10 - timeLeft) * 10}%`;

                if (timeLeft <= 0) {
                    clearInterval(unloadTimer);
                    completeUnloading();
                }
            }, 1000);
        }

        function completeUnloading() {
            clearInterval(unloadTimer);
            const xpGained = Math.floor(Math.random() * 10) + 5;
            gainXp(xpGained);
            alert(`Вы разгрузили машину и получили ${xpGained} XP!`);
            document.getElementById('unload-button').style.display = 'block'; // Показываем кнопку "Завершить"
        }

        // Показать профиль
        function showProfileScreen() {
            document.getElementById('main-screen').style.display = 'block';
            document.getElementById('unloading-screen').style.display = 'none';
            document.getElementById('tasks-screen').style.display = 'none';
        }

        // Показать разгрузку машины
        function showUnloadingScreen() {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('unloading-screen').style.display = 'flex';
            document.getElementById('tasks-screen').style.display = 'none';

            // Скрываем анимацию по умолчанию
            const truck = document.querySelector('.truck');
            const loader = document.querySelector('.loader');
            truck.classList.remove('active');
            loader.classList.remove('active');
        }

        // Показать задания
        function showTasksScreen() {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('unloading-screen').style.display = 'none';
            document.getElementById('tasks-screen').style.display = 'block';
        }

        // Изменение имени персонажа
        function startRename() {
            const newName = prompt("Введите новое имя для вашего персонажа:");
            if (newName && newName.trim() !== "") {
                player.name = newName.trim();
                gainXp(5); // +5 XP за изменение имени
                updateUI();
            }
        }

        // Реферальная система
        function showReferralTask() {
            alert(`Ваша реферальная ссылка:\nhttps://t.me/your_bot?start=ref_${player.chat_id}\nКаждый приглашенный друг дает +20 XP.`);
        }

        // Подписка на канал
        function showSubscribeTask() {
            alert("Подпишитесь на канал, чтобы получить +15 XP.");
        }

        // Добавление в статус
        function showStatusTask() {
            alert("Добавьте игру в свой статус Telegram, чтобы получить +10 XP.");
        }

        // Инициализация игры
        updateUI();
        showProfileScreen(); // По умолчанию показываем профиль
    </script>
</body>
</html>
